# A tag v1.2.3 publishes the app with the demonstration content (demo/): never the game's.
# The executable with the game's content is built on the author's machine (scripts/package.py) and given by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: pip install pillow
      - name: Package
        run: python3 -I scripts/package.py --content demo
        env:
          TALEWEAVER_VERSION: ${{ github.ref_name }}
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" dist/Taleweaver.exe dist/Taleweaver-linux-x64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
