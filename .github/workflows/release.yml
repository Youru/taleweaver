# A tag v1.2.3 publishes the app with the demonstration content (demo/): never the game's.
# The executable with the game's content is built on the author's machine (scripts/package.py) and given by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # python3 -I ignores the user's site-packages: Pillow goes into this Python's own
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pillow
      - name: Package
        run: python3 -I scripts/package.py --content demo
        env:
          TALEWEAVER_VERSION: ${{ github.ref_name }}
      - name: Publish
        # A v0.x tag, or one with a dash (v1.0.0-beta.1), is marked as a pre-release
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/Taleweaver.exe dist/Taleweaver-linux-x64.tar.gz dist/LISEZMOI.txt --title "Taleweaver $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
